<!doctype html>
<html lang="fr">

    <style>

        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;

          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #111318;
        background:
