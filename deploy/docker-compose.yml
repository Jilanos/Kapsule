# Kapsule en production : app (API + PWA) derriere Caddy (HTTPS auto).
# Lancer depuis ce dossier :  docker compose up -d --build
# Requiert SITE_DOMAIN et KAPSULE_DOMAIN (voir .env.example).

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Inscriptions fermees par defaut (AC4) : passez "open" le temps de creer
      # vos comptes, puis repassez a "closed".
      KAPSULE_REGISTRATION: ${KAPSULE_REGISTRATION:-closed}
      # Secret de signature des URLs d'assets (ADR 003). Doit etre defini.
      KAPSULE_ASSET_SECRET: ${KAPSULE_ASSET_SECRET:?definir KAPSULE_ASSET_SECRET dans .env}
    volumes:
      - kapsule-data:/data
    expose:
      - "3001"
    # Pas de ports publies : seul Caddy est expose sur le reseau.
    # Durcissement (audit 2026-07-18, AC7).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-paulmondou.fr}
      KAPSULE_DOMAIN: ${KAPSULE_DOMAIN:-kapsule.paulmondou.fr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/srv/sites:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kapsule-data: # base SQLite + uploads (donnees precieuses -> sauvegardees)
  caddy-data: # certificats Let's Encrypt
  caddy-config:
